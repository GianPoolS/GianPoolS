<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KFG - Tienda</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:0; }
    header { background:#000; color:#fff; padding:20px; text-align:center; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:20px; padding:20px; }
    .card { background:#fff; border-radius:10px; padding:15px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    .card img { width:100%; border-radius:10px; }
    .card h3 { margin:10px 0; }
    .card button { background:#25d366; border:none; padding:10px; color:#fff; border-radius:5px; cursor:pointer; width:100%; }/* ADMIN PANEL */
#adminPanel { position:fixed; top:0; right:0; background:#111; color:#fff; width:300px; height:100%; padding:20px; display:none; overflow:auto; }
#adminPanel input, #adminPanel textarea { width:100%; padding:8px; margin:5px 0; border-radius:5px; }
#adminPanel button { width:100%; padding:10px; margin-top:10px; }
#openAdmin { position:fixed; bottom:20px; right:20px; background:#000; color:#fff; padding:12px; border-radius:50%; cursor:pointer; }

  </style>
</head>
<body><header>
  <h1>KFG</h1>
  <p>Autor: GianPool</p>
</header><div class="grid" id="productGrid"></div><!-- ADMIN BUTTON --><div id="openAdmin">⚙️</div><!-- ADMIN PANEL --><div id="adminPanel">
  <h2>Panel Admin</h2>
  <p>Agregar nuevo producto</p>
  <input type="text" id="pName" placeholder="Nombre del producto">
  <input type="text" id="pPrice" placeholder="Precio">
  <input type="text" id="pImg" placeholder="URL de imagen">
  <button onclick="addProduct()">Agregar</button>
  <hr>
  <button onclick="clearProducts()" style="background:red;color:white;">Borrar TODO</button>
  <button onclick="closeAdmin()">Cerrar</button>
</div><script>
let whatsapp = "51900373696";

let products = [
  {name:"iPhone 13 Pro Max", price:"S/. 2899", img:"https://via.placeholder.com/300"},
  {name:"iPhone 14 Pro Max", price:"S/. 3299", img:"https://via.placeholder.com/300"},
  {name:"iPhone 15 Pro Max", price:"S/. 3899", img:"https://via.placeholder.com/300"},
  {name:"iPhone 16 Pro Max", price:"S/. 4399", img:"https://via.placeholder.com/300"},
  {name:"iPhone 17 Pro Max", price:"S/. 4999", img:"https://via.placeholder.com/300"},
  {name:"iPhone 13", price:"S/. 1999", img:"https://via.placeholder.com/300"},
  {name:"iPhone 14", price:"S/. 2299", img:"https://via.placeholder.com/300"},
  {name:"iPhone 15", price:"S/. 2599", img:"https://via.placeholder.com/300"},
  {name:"iPhone 16", price:"S/. 2899", img:"https://via.placeholder.com/300"},
  {name:"iPhone 17", price:"S/. 3299", img:"https://via.placeholder.com/300"},
  {name:"Samsung S20", price:"S/. 1599", img:"https://via.placeholder.com/300"},
  {name:"Samsung S21", price:"S/. 1799", img:"https://via.placeholder.com/300"},
  {name:"Samsung S22", price:"S/. 1999", img:"https://via.placeholder.com/300"},
  {name:"Samsung S23", price:"S/. 2299", img:"https://via.placeholder.com/300"},
  {name:"Samsung S25", price:"S/. 2799", img:"https://via.placeholder.com/300"}
];

function renderProducts(){
  let grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  products.forEach((p, i)=>{
    grid.innerHTML += `
      <div class='card'>
        <img src='${p.img}'>
        <h3>${p.name}</h3>
        <p><b>${p.price}</b></p>
        <button onclick="buy('${p.name}')">Comprar</button>
      </div>`
  });
}

function buy(product){
  window.open(`https://wa.me/${whatsapp}?text=Hola,%20quiero%20comprar:%20${product}`);
}

function addProduct(){
  let name = document.getElementById("pName").value;
  let price = document.getElementById("pPrice").value;
  let img = document.getElementById("pImg").value;
  products.push({name, price, img});
  save();
  renderProducts();
}

function clearProducts(){
  products = [];
  save();
  renderProducts();
}

function save(){
  localStorage.setItem("kfgProducts", JSON.stringify(products));
}

function load(){
  let data = localStorage.getItem("kfgProducts");
  if(data) products = JSON.parse(data);
}

function closeAdmin(){ document.getElementById("adminPanel").style.display = "none"; }
document.getElementById("openAdmin").onclick = ()=>{
  document.getElementById("adminPanel").style.display = "block";
};

load();
renderProducts();
</script></body>
</html>
